name: moemail

x-images:
  app: &app-image ghcr.io/xmzo/moemail-local:latest
  maintenance: &maintenance-image ghcr.io/xmzo/moemail-local:latest-tools
  postgres: &postgres-image ghcr.io/xmzo/moemail-local-postgres:latest
  postgres-tools: &postgres-tools-image ghcr.io/xmzo/moemail-local-postgres-tools:latest

x-moemail-service: &moemail-service
  image: *app-image
  pull_policy: always
  volumes:
    - ./data:/app/data
  networks:
    - default
    - database
  depends_on:
    storage-init:
      condition: service_completed_successfully
  stop_grace_period: 30s

x-maintenance-service: &maintenance-service
  image: *maintenance-image
  pull_policy: always
  volumes:
    - ./data:/app/data
  networks:
    - default
    - database
  depends_on:
    storage-init:
      condition: service_completed_successfully
  stop_grace_period: 30s
  healthcheck:
    disable: true

services:
  storage-init:
    image: *app-image
    pull_policy: always
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        install -d -o 10001 -g 10001 -m 0700 /app/data /app/data/backups /app/data/postgres-backups
        install -d -m 0700 /postgres-data
        install -d -o 10001 -g 10001 -m 0700 /backups
    volumes:
      - ./data:/app/data
      - ./data/postgres:/postgres-data
      - ./data/postgres-backups:/backups

  postgres:
    image: *postgres-image
    pull_policy: always
    user: "0:0"
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./data/postgres:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: [CMD, pg_isready, --host, 127.0.0.1, --username, moemail, --dbname, moemail]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 128mb

  moemail:
    <<: *moemail-service
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/internal/health').then(r=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  cleanup:
    <<: *maintenance-service
    profiles: [maintenance]
    restart: "no"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: [cleanup]

  migrate:
    <<: *maintenance-service
    profiles: [maintenance]
    restart: "no"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: [migrate]

  verify:
    <<: *maintenance-service
    profiles: [maintenance]
    restart: "no"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: [verify]

  postgres-backup:
    image: *postgres-tools-image
    pull_policy: always
    user: "10001:10001"
    profiles: [maintenance]
    restart: "no"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./data/postgres-backups:/app/data/postgres-backups
      - ./data/postgres-backups:/backups
    networks:
      - default
      - database
    entrypoint: [moemail-postgres-backup]

  scheduler:
    <<: *maintenance-service
    profiles: [scheduler]
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      moemail:
        condition: service_healthy
    command: [scheduler]

  postgres-backup-scheduler:
    image: *postgres-tools-image
    pull_policy: always
    user: "10001:10001"
    profiles: [scheduler]
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./data/postgres-backups:/app/data/postgres-backups
      - ./data/postgres-backups:/backups
    networks:
      - default
      - database
    entrypoint: [moemail-postgres-backup-scheduler]

  monitor:
    image: *maintenance-image
    pull_policy: always
    profiles: [monitoring]
    restart: unless-stopped
    user: "0:0"
    stop_grace_period: 30s
    network_mode: "service:moemail"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data:/app/data:ro
      - ./data/postgres:/postgres-data:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      moemail:
        condition: service_healthy
    command: [monitor-scheduler]
    healthcheck:
      disable: true

  offsite-backup:
    <<: *maintenance-service
    profiles: [offsite]
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      - ./data/postgres-backups:/app/data/postgres-backups:ro
      - ./data/postgres-backups:/backups:ro
    networks:
      - default
    command: [offsite-scheduler]
    healthcheck:
      disable: true

  postgres-restore:
    image: *postgres-tools-image
    pull_policy: always
    user: "10001:10001"
    profiles: [restore]
    restart: "no"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./data/postgres-backups:/app/data/postgres-backups
      - ./data/postgres-backups:/backups
    networks:
      - default
      - database
    entrypoint: [moemail-postgres-restore]

networks:
  database:
    internal: true
